name: CI Build, Test & Windows Release

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (.NET 10 WinUI 3 x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Nexus.sln

      - name: Build full solution (Release x64)
        run: dotnet build Nexus.sln -c Release -p:Platform=x64 --no-restore

      - name: Run unit & integration tests
        run: dotnet test tests/Nexus.Tests/Nexus.Tests.csproj -c Release -p:Platform=x64 --no-build --verbosity normal

  release-windows-installer:
    name: Build Windows Installer (.exe) & Publish Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract Release Version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Self-Contained Portable ZIP & Inno Setup EXE
        shell: pwsh
        run: |
          .\installer\build-release.ps1 -Version "${{ steps.ver.outputs.version }}" -SkipTests

      - name: Publish GitHub Release with Downloadable EXE
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/NEXUS-Setup-v${{ steps.ver.outputs.version }}-win-x64.exe
            release/NEXUS-v${{ steps.ver.outputs.version }}-win-x64-portable.zip

